# Browser security headers, sent on EVERY response (pen-test finding: missing
# CSP / X-Frame-Options / X-Content-Type-Options / Referrer-Policy / HSTS).
#
# Included from the server block AND from every location that has its own
# add_header: nginx only inherits add_header from the enclosing level when the
# inner level declares none, so a location with a Cache-Control add_header
# would otherwise silently drop all of these. Copied to
# /etc/nginx/snippets/security-headers.conf by the Dockerfile.
#
# `always` adds them to error responses (4xx/5xx) too, not just 2xx/3xx.

# CSP. The production bundle has no inline scripts and no third-party origins:
# one module script and one stylesheet from /assets/, the API on the same
# origin. React's style={{}} sets styles through the DOM, which style-src
# 'self' allows; the printed logo is inline SVG markup; the Excel export is a
# blob: download link, which CSP does not govern. data: images are allowed
# for SVG/CSS data URIs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# TLS terminates at the OpenShift Route, so nginx itself only sees HTTP, but
# the browser receives this over the HTTPS connection to the Route, which is
# where HSTS takes effect.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
