# Serves the bank-ui SPA and proxies the API, so the browser only ever talks to
# one origin. Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets are served compressed; the images already are (favicon.svg and
    # icons.svg are the only two, both small).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API ------------------------------------------------------------
    location /api/ {
        # Docker's embedded DNS. Resolving the upstream through a VARIABLE
        # defers the lookup to request time; with a literal hostname nginx
        # resolves it once at startup and refuses to start at all if bank-api
        # is not up yet — which turns a slow backend boot into a dead frontend.
        resolver 127.0.0.11 valid=10s;
        set $bank_api http://bank-api:8085;

        # No URI part on proxy_pass, so the original request path is forwarded
        # unchanged: /api/customers stays /api/customers.
        proxy_pass $bank_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A customer search is bounded by TIME, not row count — the legacy
        # SEARCHTIME, default 30s (ARCHIVAL_SEARCH_TIMEOUT_SECONDS). nginx's
        # 60s default sits uncomfortably close to that, and a proxy timeout
        # would surface as a broken page instead of the API's own "incomplete"
        # flag. Give the backend room to answer for itself.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Responses stream straight through; buffering a long search only adds
        # latency before the operator sees anything.
        proxy_buffering off;
    }

    # ---- Static assets --------------------------------------------------
    # Vite fingerprints these filenames (index-a1b2c3d4.js), so a changed file
    # is a changed URL and this can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is the only file whose name is stable,
    # and it carries the references to the fingerprinted bundles. A cached copy
    # would keep serving the previous release after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- SPA fallback ---------------------------------------------------
    # The app is a single page driven by internal state, so this rarely fires —
    # but it means a refresh on any URL returns the app rather than a bare 404,
    # and it stays correct if client-side routing is added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
