server:
  port: 8085

# ---------------------------------------------------------------------------
# APPLICATION LOG. This is the file the help desk searches.
#
# When a request fails unexpectedly the operator is shown a six-character
# reference and asked to quote it (ApiExceptionHandler). The same reference is
# written HERE against the stack trace:
#
#   ERROR c.b.a.p.rest.ApiExceptionHandler : [KQ7MTX] Unhandled
#       BadSqlGrammarException on GET /api/accounts/01008041574100
#
# so support answers "what happened to KQ7MTX" with:
#
#   Windows:  findstr KQ7MTX logs\bank-api.log
#   Unix:     grep KQ7MTX logs/bank-api.log
#
# Without a file the reference is unverifiable: Boot logs to the console only
# by default, and run-denodo.bat does not redirect it, so the evidence lived in
# a console window and died with it.
#
# Console output is UNCHANGED — this adds a file, it does not replace the
# window. Relative paths resolve against the working directory the API is
# started from (deploy\ for run-denodo.bat), same as the SQL log.
#
# NOTE: request URIs carry customer, account and card numbers, and logged
# values can carry customer names, so this file holds bank data. It wants the
# same handling as the SQL audit log: off shared paths, and not kept longer
# than the diagnosis needs. Unlike that log it is ON by default, because a
# support reference nobody can look up is worse than no reference at all.
# ---------------------------------------------------------------------------
logging:
  file:
    name: ${BANK_LOG_FILE:logs/bank-api.log}
  charset:
    # The console keeps the platform default (a Windows console cannot render
    # Arabic anyway); the FILE is pinned to UTF-8 so Arabic customer names
    # written into a log line survive being read back on another machine.
    file: UTF-8
  logback:
    rollingpolicy:
      # Rolls to logs/bank-api.log.2026-08-20.0, keeping max-history DAYS of
      # them with total-size-cap as the hard ceiling, whichever bites first.
      #
      # NOT .gz — Boot's default pattern compresses, and a compressed archive
      # defeats the one job this file has. Windows has no zgrep, so a help desk
      # asked about a reference from three days ago would have to expand an
      # archive by hand before it could search. Uncompressed, ONE command finds
      # a reference wherever it landed:
      #
      #   Windows:  findstr /S KQ7MTX logs\*
      #   Unix:     grep -r KQ7MTX logs/
      #
      # The cost is disk, and it is small: this application logs startup plus
      # faults, not traffic, so a branch PC produces a few MB a month and never
      # approaches the cap.
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i
      max-file-size: ${BANK_LOG_MAX_SIZE:20MB}
      max-history: ${BANK_LOG_MAX_HISTORY:30}
      total-size-cap: ${BANK_LOG_TOTAL_CAP:500MB}
      # Apply the retention rules at startup too, not only when a roll happens:
      # a PC that is shut down every evening rolls rarely, so without this an
      # old archive is never cleaned up.
      clean-history-on-start: true

# Authentication (ported from the LoanOriginationSystem auth slice): the SPA
# sends the password AES-encrypted; the API verifies it via an Active Directory
# bind (bank.ldap.*), then gates on the allow-list below, then issues an HS256
# JWT the UI sends as a Bearer token on every /api call (validated by Spring
# Security's resource server — see SecurityConfig).
bank:
  jwt:
    # Set a strong secret (>= 32 chars) via BANK_JWT_SECRET in any real
    # deployment; blank falls back to the dev key baked into SecurityConfig.
    secret: ${BANK_JWT_SECRET:}
    # Access-token lifetime. Short (15 min) because it slides: any authenticated
    # /api call past the halfway mark returns a refreshed token (X-Refresh-Token
    # header) that the SPA adopts, so an active operator is never logged out — the
    # clock only runs down during ~15 min of true inactivity.
    ttl-seconds: ${BANK_JWT_TTL_SECONDS:900}
    issuer: ${BANK_JWT_ISSUER:BankStaticData}
    audience: ${BANK_JWT_AUDIENCE:BankClients}
  auth:
    # AES passphrase shared with the SPA (frontend PASSWORD_KEY_PASSPHRASE); the
    # SPA derives the same key (SHA-256) so the plaintext never crosses the wire.
    # Transport obfuscation only — TLS is the real control. Keep both in sync.
    password-key-passphrase: ${BANK_AUTH_PASSPHRASE:BANK-CSD-Login-Key-2026}
    # Interim single "admin" authority granted to EVERY authenticated user — it
    # contains every ~NN code the app gates on, so it unlocks the whole enquiry
    # application. NOTE: ~99 is deliberately EXCLUDED — it is the legacy
    # "enquiry-only user" marker that DISABLES customer search (CustomerStaticData
    # canSearchCustomer), so an admin must not carry it. Replace with per-user
    # authority once that mapping is agreed.
    admin-authority: ${BANK_ADMIN_AUTHORITY:~00~01~02~04~06~32~41~42~43~45~50~60~61~62~81~86~87~94~}
    # Branch stamped on the session when no local profile supplies one (LDAP path).
    admin-branch: ${BANK_ADMIN_BRANCH:0001}
    # NOTE: allowed-users is NOT here. It lives in the runtime configuration file
    # (bank.runtime-config.file below) so the list can be changed while the
    # application is running.
  ldap:
    # Active Directory bind authentication. OFF by default so machines with no
    # domain (local dev) keep working on the local fallback ladder. Switch on per
    # environment once url + domain are filled in.
    enabled: ${BANK_LDAP_ENABLED:false}
    # Accepts the ADsPath form the bank already uses — LDAP://host/DC=xx,DC=xx —
    # and splits it, so paste it verbatim. Plain ldap://host:389 / ldaps://host:636
    # also work; the port defaults to 389 (636 for ldaps) when omitted.
    url: ${BANK_LDAP_URL:}
    # AD domain, e.g. anb.com.sa — used to bind as user@domain. Required.
    domain: ${BANK_LDAP_DOMAIN:}
    # Search root. Blank = take the DC=... part of the ADsPath, or let Spring
    # derive it from the domain when the URL carries no path.
    root-dn: ${BANK_LDAP_ROOT_DN:}
    # Allow the local fallback ladder when the directory is UNREACHABLE. A
    # directory that answers "wrong password" is always final regardless of this.
    fallback-to-local-users: ${BANK_LDAP_FALLBACK:true}
  # SQL audit log — every /api hit and the queries that ran behind it, written
  # to a file of its own (never to the console, never mixed with the app log).
  # An entry per API call: the request line, then each statement with its SQL
  # exactly as the driver received it (Denodo view prefixes already applied) with
  # the bound values substituted for their ? so it can be pasted into Design
  # Studio and run, the row count and the elapsed time.
  #
  #   2026-08-19 14:22:01.412 [r-7f] >>>> GET /api/customers/0123456 user=DEVUSER
  #   2026-08-19 14:22:01.502 [r-7f] SQL #1 · archival · 1 row · 84 ms
  #       SELECT c.custNo, c.name1 FROM bv_impala_stg_bankmaster_stcusttab c
  #       WHERE c.custNo = '0123456' AND c.BankingDate = '2009-07-11'
  #   2026-08-19 14:22:01.560 [r-7f] <<<< 200 · 1 query · 148 ms
  #
  # OFF by default: no proxy is installed and no file is created. Turn it on for
  # a diagnostic run with BANK_SQL_LOG=true (it applies to the denodo profile —
  # the mock profile has no database and so no queries to record).
  #
  # NOTE: parameter values are written in the CLEAR, so an enabled log holds
  # real customer, account and ID numbers. Treat the file as bank data: keep it
  # off shared paths and delete it when the diagnosis is done.
  sql-log:
    enabled: ${BANK_SQL_LOG:false}
    # Relative paths resolve against the working directory the API is started
    # from (deploy\ for run-denodo.bat).
    file: ${BANK_SQL_LOG_FILE:logs/bank-api-sql.log}
    # Rolls at this size to bank-api-sql.log.1, .2, … keeping max-history of them.
    max-size-mb: ${BANK_SQL_LOG_MAX_MB:50}
    max-history: ${BANK_SQL_LOG_HISTORY:3}
  # ------------------------------------------------------------------------
  # RUNTIME CONFIGURATION FILE — the settings an operator may change WITHOUT
  # restarting the API. Everything else in this file is startup configuration.
  #
  # Currently two settings live there:
  #     allowed-users   who may log in
  #     banking-date    the archival restore snapshot every query filters on
  #
  # It is a plain properties file next to the jar (created with a documented
  # template on first start). Edit and save it and the change is picked up
  # within poll-millis: the next login sees the new allow-list, the next query
  # binds the new BankingDate. A file that fails to parse is REJECTED and the
  # previously loaded values stay in force — see RuntimeSettings.
  # ------------------------------------------------------------------------
  runtime-config:
    # Relative paths resolve against the working directory the API is started
    # from (deploy\ for run-denodo.bat), same as the SQL log above.
    file: ${BANK_RUNTIME_CONFIG_FILE:bank-runtime.properties}
    # How often the file's timestamp may be checked, at most. One stat per
    # second, not one per query.
    poll-millis: ${BANK_RUNTIME_CONFIG_POLL_MS:1000}
  cors:
    # Origins allowed to call /api/** (the Vite dev server). Comma-separated.
    allowed-origins: ${BANK_CORS_ORIGINS:http://localhost:5173,http://localhost:5199}

# Swagger/OpenAPI is OFF everywhere by default. Enable temporarily with
# SPRINGDOC_ENABLED=true (e.g. `SPRINGDOC_ENABLED=true mvn spring-boot:run`
# or `set SPRINGDOC_ENABLED=true` before run-denodo.bat).
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}

spring:
  profiles:
    # "mock" serves fixtures with no database. Run with
    # --spring.profiles.active=denodo on the target PC to use the real
    # Denodo (Hive views) connections below.
    default: mock

---

bank:
  archival-db:            # DB #1 — BM archival schema via Denodo Hive views
    jdbc-url: ${ARCHIVAL_DB_URL:jdbc:vdb://denodo-host:9999/archival}
    username: ${ARCHIVAL_DB_USER:}
    password: ${ARCHIVAL_DB_PASSWORD:}
    driver-class-name: com.denodo.vdp.jdbc.Driver
    read-only: true
    maximum-pool-size: 4
    # Denodo exposes the BM tables under an environment-specific prefix, e.g.
    # stcusttab -> bv_impala_stg_bankmaster_stcusttab. Set it here and every
    # query is rewritten automatically; blank means "views named like the
    # legacy tables". Change this (not the SQL) when moving staging -> prod.
    table-prefix: ${ARCHIVAL_DB_TABLE_PREFIX:bv_impala_stg_bankmaster_}
    # NOTE: banking-date is NOT here. Every archival view carries a BankingDate
    # column (the ETL's "Data Restored date", key part 1 on 98 of the 106 views)
    # and every query this app issues adds
    #
    #     WHERE ... AND <alias>.BankingDate = :bankingDate
    #
    # so one value pins the whole application to a single restore snapshot. That
    # value now lives in the RUNTIME CONFIGURATION FILE (bank.runtime-config.file
    # above) as banking-date, because moving the application to another snapshot
    # is an operational act that must not require a restart. See that file for
    # the format rules and DENODO-VIEWS.md for which views span which dates.
    # Customer-search clock, the legacy's SEARCHTIME (cbcmssrv.cfg = 30;
    # cbrouter.c:92 default). A search is bounded by TIME, not row count: when
    # it expires the rows already read are returned with an "incomplete" flag,
    # exactly as the C's alarm(searchTimeOut) did (cbbranch.c:1728-1755).
    search-timeout-seconds: ${ARCHIVAL_SEARCH_TIMEOUT_SECONDS:30}
  # NO online-db (DB #2). It was a second pool onto the same Denodo server —
  # every property defaulted to its archival counterpart and no repository
  # queried it — so it is merged into archival-db above. On-demand Statement and
  # Transaction Inquiry no longer need it either: their legacy server (cbrt01)
  # read local gld0data/crd0data/thd0data, so JdbcOnlineEnquiryRepository serves
  # them from DB #1. What genuinely still lives on the Finacle gateway is the
  # card screens' customer header (the TODO(DB #2) markers in JdbcCardRepository).
  # When that source turns up on its own engine, add the block back with its own
  # URL + driver and drop that engine's JDBC driver jar next to the Denodo one
  # in -Dloader.path.
  statement-db:           # DB #3 — the statement archive, Historical Statement only.
                          # A SEPARATE Oracle instance, not Denodo and not DB #2:
                          # it replaces the legacy's Btrieve statement index plus
                          # the zipped pre-rendered pages it pointed at
                          # (frmHistStmt.frm), and holds nothing else. Its
                          # ojdbc driver is a normal pom.xml dependency bundled
                          # into the jar — nothing to drop into -Dloader.path,
                          # unlike the Denodo driver.
                          #
                          # OFF by default: with no URL configured the screen
                          # reports itself unavailable rather than failing with a
                          # driver error. Set STATEMENT_DB_ENABLED=true once the
                          # URL, credentials and table names below are filled in.
    enabled: ${STATEMENT_DB_ENABLED:false}
    jdbc-url: ${STATEMENT_DB_URL:}
    username: ${STATEMENT_DB_USER:}
    password: ${STATEMENT_DB_PASSWORD:}
    driver-class-name: ${STATEMENT_DB_DRIVER:oracle.jdbc.OracleDriver}
    read-only: true
    maximum-pool-size: 2
    # Schema qualifier, applied after FROM/JOIN exactly like the archival prefix
    # (SqlTablePrefixer). Note the trailing dot: "O2MS_UPG1." turns
    # "FROM STMT_TXN" into "FROM O2MS_UPG1.STMT_TXN". Blank if the connection's
    # own default schema already resolves the tables.
    table-prefix: ${STATEMENT_DB_TABLE_PREFIX:O2MS_UPG1.}
    # ---------------------------------------------------------------------
    # Table names. Only PDP_STMT_TXN was confirmed from the DBA screenshots;
    # the other three are placeholders following the same naming. CORRECT THESE
    # against the real schema before switching `enabled` on — a wrong name is a
    # startup-clean, query-time ORA-00942.
    #
    # Two header/detail PAIRS exist with near-identical shapes. They are paired
    # by their key, not by name: one header and one detail carry STMT_NUM and
    # one of each does not, and a detail can only join a header sharing its key.
    # PDP_STMT_TXN (confirmed) has NO STMT_NUM, so the PDP header is the one
    # keyed on ACCT_NUM + STMT_DATE alone — the one with CUST_NUM,
    # TITLE/FIRST_NAME/SECOND_NAME, PAGE_NUM and BRANCH_DATA. The non-PDP pair
    # is the one WITH STMT_NUM, whose header carries a single CUST_NAME plus
    # IBAN and REF_NUM.
    #
    # What actually distinguishes the two archives is not recorded anywhere:
    # "PDP" appears nowhere in the VB6, the C, or the archival dictionary. So
    # neither is guessed at: the SCREEN carries a System selector (BM / PDP) and
    # exactly the chosen pair is queried. Blanking a pair's table names leaves
    # that system unconfigured — selecting it then reports which properties are
    # missing rather than returning "no report found".
    #
    # The non-PDP pair is the BM one — the archive holding the statements the
    # legacy screen itself produced — and is what the selector defaults to.
    # ---------------------------------------------------------------------
    hdr-table: ${STATEMENT_DB_HDR_TABLE:STMT_HDR}
    txn-table: ${STATEMENT_DB_TXN_TABLE:STMT_TXN}
    pdp-hdr-table: ${STATEMENT_DB_PDP_HDR_TABLE:PDP_STMT_HDR}
    pdp-txn-table: ${STATEMENT_DB_PDP_TXN_TABLE:PDP_STMT_TXN}
